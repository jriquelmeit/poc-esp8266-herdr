; PlatformIO Project Configuration File
; Project: ESP8266 Herdr TFT Companion 1.77" ST7735 (128x160)

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 160000000L ; Overclock seguro a 160MHz para animaciones a 60 FPS

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D ST7735_BLACKTAB=1
    -D TFT_CS=15   ; D8 (GPIO15)
    -D TFT_DC=0    ; D3 (GPIO0)
    -D TFT_RST=2   ; D4 (GPIO2)
    -D TFT_MOSI=13 ; D7 (GPIO13 / HSPI MOSI)
    -D TFT_SCLK=14 ; D5 (GPIO14 / HSPI SCK)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000
